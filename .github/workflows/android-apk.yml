# Builds an installable Android APK and publishes it as a GitHub pre-release,
# so a test build can be downloaded straight onto a phone.
#
# Runs on every push to a release/** branch, or manually (Actions tab → Android
# APK → Run workflow). Signed with the release key when the KEYSTORE_* secrets
# are set (so it installs over a sideloaded release build); otherwise with a
# throwaway debug key, which means uninstalling the existing app first.
name: Android APK

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch pose models
        run: bash ../scripts/fetch_pose_model.sh full

      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
            echo "Signing with the release key."
          else
            echo "No KEYSTORE_BASE64 secret — signing with a debug key."
          fi

      - run: flutter pub get

      - name: Test
        run: flutter test

      # One APK per CPU architecture: each is a fraction of the universal APK's
      # size (modern phones need arm64-v8a).
      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="apk-${VERSION//+/-build}-run${GITHUB_RUN_NUMBER}"
          OUT=build/app/outputs/flutter-apk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "$OUT/app-$ABI-release.apk" "$OUT/ai-cornerman-${VERSION//+/-}-$ABI.apk"
          done
          gh release create "$TAG" "$OUT"/ai-cornerman-*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test APK ${VERSION} (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Most phones: download the **arm64-v8a** APK and tap it to install."

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/ai-cornerman-*.apk
