# Compiles the iOS app (no signing) — the only check the Swift plugins get, as
# nothing else in CI builds for iOS. Manual: macOS runners are costly.
name: iOS build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch pose models
        run: bash ../scripts/fetch_pose_model.sh full
      - run: flutter pub get
      - name: Build (no codesign)
        run: flutter build ios --debug --no-codesign
