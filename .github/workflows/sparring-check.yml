# Sparring mode checks: the isolation guard (a sparring change may not edit the
# single-person pipeline), the analyzer over the sparring code, the whole test
# suite (the existing tests must pass untouched) and the sparring edge
# function's tests. Fast feedback without building an APK.
name: Sparring checks

on:
  push:
    branches: ["feat/sparring**"]
  pull_request:
    paths:
      - "app/lib/sparring/**"
      - "app/test/sparring/**"
      - "app/packages/sparring_pose/**"
      - "supabase/functions/sparring/**"
      - "supabase/migrations/*sparring*"
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sparring stays separate
        run: bash scripts/check_sparring_isolation.sh origin/main

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Failures are also posted as annotations (in chunks), so they can be
      # read from the API without downloading the logs.
      - name: Analyze sparring
        run: |
          flutter analyze --no-fatal-infos lib/sparring test/sparring lib/ui/screens/home_screen.dart lib/ui/screens/history_screen.dart > analyze.txt 2>&1 || {
            cat analyze.txt
            grep -E "(error|warning) •" analyze.txt | split -l 25 - chunk_
            for f in chunk_*; do echo "::error title=analyze::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
            exit 1
          }
          cat analyze.txt
      - name: Sparring tests
        run: |
          flutter test test/sparring > sparring_tests.txt 2>&1 || {
            cat sparring_tests.txt
            grep -vE "^[0-9:]+ \+[0-9]+.*: (loading|.*)$" sparring_tests.txt | grep -v "^$" | head -400 | split -l 40 - tchunk_
            for f in tchunk_*; do echo "::error title=tests::$(sed ':a;N;$!ba;s/\n/%0A/g;s/%/%25/g' "$f" | sed 's/%250A/%0A/g')"; done
            exit 1
          }
          tail -5 sparring_tests.txt
      - name: Whole suite (existing tests untouched)
        run: |
          flutter test > all_tests.txt 2>&1 || {
            grep -E "\[E\]|Expected|Actual|Error|error:" all_tests.txt | head -200 | split -l 40 - achunk_
            for f in achunk_*; do echo "::error title=suite::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
            tail -40 all_tests.txt
            exit 1
          }
          tail -5 all_tests.txt

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test the sparring function
        working-directory: supabase/functions
        run: |
          echo '{"imports":{"https://esm.sh/@supabase/supabase-js@2":"npm:@supabase/supabase-js@2"}}' > /tmp/import_map.json
          deno check --import-map /tmp/import_map.json sparring/index.ts
          deno test --import-map /tmp/import_map.json sparring/
