group 'com.aiboxingcoach.pose_landmarker'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.aiboxingcoach.pose_landmarker'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // MediaPipe Tasks Vision requires 24.
        minSdk 24
    }
}

dependencies {
    // Pose Landmarker lives in tasks-vision. Pinned to 0.10.35: 0.10.14's AAR
    // ships a pre-R8'd protobuf whose `platform_` field was stripped from a GPU
    // options message while its descriptor still names it, so on some devices'
    // ART the reflection path throws "Field platform_ for x6.d0 not found" when
    // PoseLandmarker.createFromOptions builds its graph. Newer AARs regenerate
    // those protos against a current protobuf and don't hit it.
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}
