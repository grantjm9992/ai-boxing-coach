name: pose_landmarker
description: >-
  Thin federated plugin around MediaPipe Tasks Vision Pose Landmarker. Runs pose
  estimation over a recorded clip (VIDEO mode) and streams the landmark
  sequence. Android only for v0.5; iOS is a later target.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aiboxingcoach.pose_landmarker
        pluginClass: PoseLandmarkerPlugin
