name: sparring_pose
description: >-
  Multi-person pose extraction for sparring mode: MediaPipe Tasks Vision Pose
  Landmarker over a recorded clip (VIDEO mode), every detected body per frame
  with an appearance descriptor for identity tracking. Android + iOS. Separate
  from pose_landmarker on purpose — the single-person pipeline is untouched.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aiboxingcoach.sparring_pose
        pluginClass: SparringPosePlugin
      ios:
        pluginClass: SparringPosePlugin
