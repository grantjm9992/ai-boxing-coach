[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxing-coach"
version = "0.1.0"
description = "Vision-analysis skeleton for an AI boxing coach: video -> pose -> coach rules -> observations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Only needed to process real video; the engine runs without them.
# mediapipe is capped below 1.0: the 1.0 release removed the legacy
# `mp.solutions` API (Pose etc.) that the estimator uses. 0.10.x still ships it.
vision = ["mediapipe>=0.10.14,<1.0", "opencv-python>=4.8"]
dev = ["pytest>=7.4"]

[project.scripts]
boxing-coach = "boxing_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
