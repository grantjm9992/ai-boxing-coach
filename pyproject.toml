[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxing-coach"
version = "0.1.0"
description = "Vision-analysis skeleton for an AI boxing coach: video -> pose -> coach rules -> observations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Only needed to process real video; the engine runs without them.
# mediapipe is capped at <0.10.30: the legacy `mp.solutions` API (Pose etc.)
# that the estimator uses was removed in 0.10.30. 0.10.21 is the last release
# that still ships it. Resolves to 0.10.21.
vision = ["mediapipe>=0.10.14,<0.10.30", "opencv-python>=4.8"]
dev = ["pytest>=7.4"]

[project.scripts]
boxing-coach = "boxing_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
