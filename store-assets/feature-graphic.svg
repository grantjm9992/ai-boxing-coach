<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="88%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FF3B30" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="#0A0A0B"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Faint pose skeleton, right side -->
  <g transform="translate(724,70) scale(2.55)" stroke="#FF3B30" stroke-opacity="0.16" stroke-width="1.4" fill="none" stroke-linecap="round">
    <line x1="50" y1="24" x2="50" y2="42"/>
    <line x1="50" y1="42" x2="38" y2="34"/>
    <line x1="50" y1="42" x2="62" y2="34"/>
    <line x1="38" y1="34" x2="41" y2="30"/>
    <line x1="62" y1="34" x2="59" y2="30"/>
    <line x1="50" y1="42" x2="45" y2="66"/>
    <line x1="50" y1="42" x2="55" y2="66"/>
    <line x1="45" y1="66" x2="43" y2="92"/>
    <line x1="55" y1="66" x2="60" y2="92"/>
    <line x1="43" y1="92" x2="41" y2="116"/>
    <line x1="60" y1="92" x2="63" y2="116"/>
  </g>
  <g transform="translate(724,70) scale(2.55)" fill="#FF3B30" fill-opacity="0.28">
    <circle cx="50" cy="22" r="2.6"/>
    <circle cx="38" cy="34" r="2"/><circle cx="62" cy="34" r="2"/>
    <circle cx="45" cy="66" r="2"/><circle cx="55" cy="66" r="2"/>
    <circle cx="43" cy="92" r="2"/><circle cx="60" cy="92" r="2"/>
  </g>

  <!-- Reticle mark -->
  <g transform="translate(88,150)">
    <rect width="104" height="104" rx="22" fill="#141416" stroke="#26252b" stroke-width="1.5"/>
    <g transform="translate(52,52) scale(2.6)" fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round">
      <circle cx="0" cy="0" r="9"/>
      <path d="M0 -13v6M0 13v-6M-13 0h6M13 0h-6"/>
    </g>
    <circle cx="52" cy="52" r="5.5" fill="#FF3B30"/>
  </g>

  <!-- Wordmark -->
  <text x="228" y="196" fill="#F5F5F7" font-size="58" font-weight="800" letter-spacing="2">AI BOXING <tspan fill="#FF3B30">COACH</tspan></text>

  <!-- Headline -->
  <text x="228" y="252" fill="#F5F5F7" font-size="34" font-weight="700">Train alone. Get coached.</text>

  <!-- Subline -->
  <text x="90" y="330" fill="#9AA1AC" font-size="23" font-weight="500">Record a round — AI reads your technique and tells you</text>
  <text x="90" y="362" fill="#9AA1AC" font-size="23" font-weight="500">exactly what to fix. Guard, stance, punches, footwork.</text>

  <!-- On-device chip -->
  <g transform="translate(90,398)">
    <rect width="196" height="34" rx="17" fill="#141416" stroke="#2b2a30" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#2E9E7B"/>
    <text x="34" y="23" fill="#CFCED6" font-size="15" font-weight="600" letter-spacing="0.5">Analyses on-device</text>
  </g>
</svg>
